<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Simulation IA — Outpost 5v5</title>
<style>
  :root{ --atk:#ff5f5f; --def:#4ecd6a; --bg:#0b0d12; }
  html,body{ margin:0; padding:0; width:100%; height:100%; background:var(--bg); overflow:hidden; font-family:'Inter',Arial,sans-serif; color:#e8ecf2; }
  #canvasWrap{ position:absolute; inset:0; }

  /* ===== Bandeau d'info (veto CURRENT/NEXT/DECIDER à gauche, contexte du
     match — ligue/phase/jour — à droite) : fine bande au-dessus du bandeau
     de score, comme sur une diffusion pro. Rempli par le manager (voir
     setVetoBanner/setContextBanner, appelés depuis 'matchInit') — vide et
     invisible en simulation autonome (aucune donnée à afficher). ===== */
  #topInfoBar{ position:absolute; top:0; left:0; right:0; height:26px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; background:rgba(8,10,15,.92); border-bottom:1px solid rgba(255,255,255,.06); font-size:10.5px; font-weight:700; letter-spacing:.03em; color:#c7ced8; text-transform:uppercase; z-index:5; pointer-events:none; }
  #vetoInfo{ display:flex; gap:16px; }
  #vetoInfo span b{ color:#9dd8e0; font-weight:800; }
  #contextInfo{ opacity:.85; }
  /* ===== Bandeau de score (fiches joueurs avec avatar) ===== */
  /* justify-content:center (au lieu de space-between) + gap : les deux
     bandeaux d'équipe restent COLLÉS au round/chrono central, comme sur
     une diffusion pro — avant, ils étaient plaqués aux bords opposés de
     l'écran avec un immense vide au milieu. */
  #scoreboard{ position:absolute; top:26px; left:0; right:0; display:flex; justify-content:center; align-items:flex-start; gap:36px; padding:10px 16px; background:linear-gradient(to bottom, rgba(8,10,15,.92), rgba(8,10,15,0)); pointer-events:none; z-index:5; }
  /* align-items:flex-start évite que .sb-teamhead/.sb-pips/.sb-banner-eco
     s'étirent (stretch, comportement par défaut d'un flex-column) à la
     largeur de la rangée de 5 fiches joueurs juste en dessous — sans ça,
     le bandeau équipe devenait une immense boîte vide côté attaque, alors
     que côté défense .right (déjà en flex-end) restait compact. */
  .sb-group{ display:flex; flex-direction:column; gap:4px; align-items:flex-start; }
  .sb-group.right{ align-items:flex-end; }
  /* ===== Bandeau équipe (badge + tag + pips + gros score), façon
     broadcast pro — remplace l'ancien bandeau texte plat. ===== */
  .sb-teamhead{ display:flex; align-items:center; gap:10px; padding:5px 12px; background:linear-gradient(135deg,rgba(20,24,32,.92),rgba(14,17,24,.8)); border:1px solid rgba(255,255,255,.1); border-radius:8px; }
  .sb-teamhead.right{ flex-direction:row-reverse; }
  /* Pas de vrai logo d'équipe (aucun asset image) : un simple disque coloré
     par camp fait office de repère visuel — jamais le tag en double dedans,
     ça faisait "EA EA" affiché deux fois côte à côte. */
  .sb-badge{ width:26px; height:26px; border-radius:50%; flex-shrink:0; background:#9dd8e0; border:2px solid rgba(255,255,255,.75); }
  .sb-tag{ font-size:15px; font-weight:800; letter-spacing:.04em; color:#e8ecf2; text-transform:uppercase; }
  .sb-tag.atk{ color:var(--atk); } .sb-tag.def{ color:var(--def); }
  .sb-bigscore{ font-size:28px; font-weight:800; color:#e8ecf2; font-variant-numeric:tabular-nums; min-width:26px; text-align:center; }
  .sb-pips{ display:flex; gap:3px; margin:4px 14px 0; }
  .sb-pips.right{ flex-direction:row-reverse; margin-left:auto; }
  .pip{ width:6px; height:6px; transform:rotate(45deg); background:rgba(255,255,255,.15); flex-shrink:0; }
  .pip.won{ background:#e8ecf2; }
  .sb-banner-eco{ font-size:9.5px; font-weight:700; color:#7fe08a; font-variant-numeric:tabular-nums; margin:2px 14px 0; }
  .sb-group.right .sb-banner-eco{ margin-left:auto; }
  /* ===== Panneaux joueurs — colonnes VERTICALES le long des bords gauche/
     droit (comme une diffusion pro : 5 fiches empilées de chaque côté),
     détachées du bandeau de score du haut (jamais dedans, sinon elles
     l'étirent — voir le bug corrigé plus haut). Chaque fiche est une carte
     HORIZONTALE (avatar | infos | KDA+crédits), symétrique en miroir côté
     droit (.sb-card.right). ===== */
  /* Les deux colonnes démarrent à la MÊME hauteur (top:266px, sous la
     minimap à gauche) : c'est ce qui les aligne "face à face" ligne par
     ligne — avant, la droite démarrait plus haut (rien à compenser en
     face) et les fiches ne se répondaient plus d'un côté à l'autre. */
  .sb-side{ position:absolute; top:266px; left:12px; display:flex; flex-direction:column; gap:6px; z-index:5; pointer-events:none; }
  .sb-side.right{ left:auto; right:12px; }
  #minimap{ position:absolute; top:60px; left:12px; width:190px; height:190px; border-radius:6px; border:1px solid rgba(255,255,255,.12); z-index:5; }
  .sb-card{ width:250px; background:rgba(14,17,24,.85); border:1px solid rgba(255,255,255,.08); border-radius:6px; padding:6px 10px; display:flex; align-items:center; gap:8px; transition:opacity .3s; }
  .sb-card.right{ flex-direction:row-reverse; }
  .sb-card.dead{ opacity:.35; }
  .sb-avatar{ width:34px; height:34px; flex-shrink:0; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; color:#0a0e16; border:2px solid rgba(255,255,255,.7); }
  .sb-cardmain{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .sb-card.right .sb-cardmain{ align-items:flex-end; text-align:right; }
  .sb-cardtop{ display:flex; align-items:baseline; gap:5px; }
  .sb-card.right .sb-cardtop{ flex-direction:row-reverse; }
  .sb-name{ font-size:12px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:110px; }
  .sb-agent{ font-size:10px; font-weight:600; color:#9dd8e0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sb-hpbar{ width:100%; height:4px; border-radius:2px; background:rgba(255,255,255,.12); overflow:hidden; }
  .sb-hpfill{ height:100%; background:#7fe08a; transition:width .2s; }
  .sb-cardbottom{ display:flex; align-items:center; gap:6px; }
  .sb-card.right .sb-cardbottom{ flex-direction:row-reverse; }
  .sb-weapon{ font-size:9.5px; color:#c7ced8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sb-abilities{ display:flex; gap:3px; }
  .sb-spell{ font-size:8px; font-weight:800; padding:1px 4px; border-radius:3px; background:rgba(255,255,255,.06); color:#5b6472; }
  .sb-spell.owned{ background:rgba(157,216,224,.22); color:#9dd8e0; }
  .sb-spell.ult{ background:rgba(255,207,74,.15); color:#5b6472; }
  .sb-spell.ult.ready{ background:#ffcf4a; color:#0a0e16; }
  .sb-cardside{ flex-shrink:0; display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
  .sb-card.right .sb-cardside{ align-items:flex-start; }
  .sb-kda{ font-size:10px; color:#9aa3af; font-variant-numeric:tabular-nums; }
  .sb-credits{ font-size:10px; color:#7fe08a; font-weight:700; font-variant-numeric:tabular-nums; }
  #scoreCenter{ text-align:center; padding-top:2px; }
  #scoreCenter .map{ font-size:10px; letter-spacing:.08em; color:#9dd8e0; font-weight:800; text-transform:uppercase; }
  #scoreCenter .roundlabel{ font-size:12px; font-weight:800; letter-spacing:.06em; color:#e8ecf2; text-transform:uppercase; margin-top:2px; }
  #scoreCenter .roundTimer{ font-size:19px; font-weight:800; margin-top:2px; color:var(--atk); font-variant-numeric:tabular-nums; }
  #scoreCenter .roundTimer.low{ color:#fff; }
  #scoreCenter .phase{ font-size:10.5px; font-weight:700; margin-top:2px; color:#c7ced8; }

  /* ===== Kill-feed =====
     En HAUT à droite, dans l'espace laissé libre entre le bandeau d'équipe
     (~top:100px) et le début de la colonne joueurs (top:266px, alignée sur
     la gauche sous la minimap — voir .sb-side) : les deux colonnes démarrant
     maintenant à la même hauteur, cet espace est garanti libre des deux
     côtés, contrairement à l'ancien ancrage en haut qui chevauchait les
     fiches joueurs avant qu'elles ne soient repositionnées. */
  #killfeed{ position:absolute; right:12px; top:100px; width:260px; max-height:156px; display:flex; flex-direction:column; gap:5px; z-index:5; pointer-events:none; overflow:hidden; }
  .kf-item{ background:rgba(10,13,20,.85); backdrop-filter:blur(2px); border:1px solid rgba(255,255,255,.07); border-radius:6px; padding:6px 10px; font-size:11.5px; display:flex; align-items:center; gap:6px; box-shadow:0 2px 6px rgba(0,0,0,.35); animation:kfIn .2s ease-out; }
  .kf-item .n{ font-weight:700; }
  .kf-item .n.atk{ color:var(--atk); } .kf-item .n.def{ color:var(--def); }
  .kf-item .wpn{ opacity:.55; font-size:10px; }
  .kf-item.revenge{ border-color:#ffcf4a; box-shadow:0 0 0 1px rgba(255,207,74,.4) inset, 0 2px 6px rgba(0,0,0,.35); }
  .kf-revenge-tag{ font-size:9.5px; font-weight:800; color:#ffcf4a; }
  .kf-item.kf-timeout{ border-color:rgba(255,159,67,.4); color:#ff9f43; }
  .kf-item.kf-timeout .n{ color:#ff9f43; }
  @keyframes kfIn{ from{opacity:0;transform:translateX(8px);} to{opacity:1;transform:translateX(0);} }


  /* ===== Contrôles ===== */
  #controls{ position:absolute; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:8px; align-items:center; z-index:6; }
  .btn{ background:rgba(20,24,32,.9); border:1px solid rgba(255,255,255,.12); color:#e8ecf2; border-radius:7px; padding:8px 13px; font-size:12.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .btn:hover{ background:rgba(35,40,52,.95); }
  .btn.active{ background:#5b8cff; border-color:#5b8cff; }
  .speedgrp{ display:flex; gap:4px; }

  #centerBanner{ position:absolute; left:50%; top:120px; transform:translateX(-50%); text-align:center; font-weight:800; font-size:20px; text-shadow:0 2px 8px rgba(0,0,0,.9); opacity:0; transition:opacity .3s; z-index:6; pointer-events:none; }
  #centerBanner.show{ opacity:1; }
  #centerBanner .sub{ font-size:12px; font-weight:600; opacity:.85; margin-top:3px; }
  /* ===== Vue subjective (première personne) ===== */
  .sb-card{ cursor:pointer; pointer-events:auto; }
  .sb-card.spectating{ border-color:#ffcf4a; box-shadow:0 0 0 2px rgba(255,207,74,.55) inset; }
  #spectateBanner{
    position:absolute; left:50%; top:70px; transform:translateX(-50%); z-index:7;
    background:rgba(10,13,20,.88); border:1px solid rgba(255,207,74,.5); border-radius:8px;
    padding:7px 14px; font-size:12px; font-weight:700; color:#ffcf4a; display:none; align-items:center; gap:10px;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  #spectateBanner.show{ display:flex; }
  #spectateBanner .spec-exit{ font-size:10.5px; font-weight:600; color:rgba(255,255,255,.6); cursor:pointer; }
  #spectateBanner .spec-exit:hover{ color:#fff; }
  /* ===== Mode réalisateur (suit les duels automatiquement) ===== */
  #directorBanner{
    position:absolute; left:50%; top:70px; transform:translateX(-50%); z-index:7;
    background:rgba(10,13,20,.88); border:1px solid rgba(91,140,255,.5); border-radius:8px;
    padding:7px 14px; font-size:12px; font-weight:700; color:#8ab0ff; display:none; align-items:center; gap:10px;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  #directorBanner.show{ display:flex; }
  #directorBanner .dir-exit{ font-size:10.5px; font-weight:600; color:rgba(255,255,255,.6); cursor:pointer; }
  #directorBanner .dir-exit:hover{ color:#fff; }
  /* ===== Time-Out tactique ===== */
  .sb-timeout-count{ font-size:9px; font-weight:700; color:#ff9f43; margin:2px 14px 0; letter-spacing:.02em; }
  .sb-group.right .sb-timeout-count{ margin-left:auto; }
  #timeoutBtn.active{ background:#ff9f43; border-color:#ff9f43; }
  #timeoutBtn:disabled{ opacity:.4; cursor:not-allowed; }
  #timeoutPopup{
    position:absolute; left:50%; top:64px; transform:translateX(-50%); z-index:10;
    background:rgba(10,13,20,.95); border:1px solid rgba(255,159,67,.55); border-radius:14px;
    padding:14px 26px; min-width:300px; text-align:center; display:none;
    box-shadow:0 12px 40px rgba(0,0,0,.55);
  }
  #timeoutPopup.show{ display:block; }
  #timeoutPopup .to-eyebrow{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#ff9f43; }
  #timeoutPopup .to-team{ display:flex; align-items:center; justify-content:center; gap:8px; margin:6px 0 2px; }
  #timeoutPopup .to-badge{ width:22px; height:22px; border-radius:50%; border:2px solid rgba(255,255,255,.75); flex-shrink:0; }
  #timeoutPopup .to-name{ font-size:15px; font-weight:800; }
  #timeoutPopup .to-meta{ font-size:11.5px; color:rgba(232,236,242,.65); margin-bottom:4px; }
  #timeoutPopup .to-clock{ font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; color:#ff9f43; }
  #timeoutPopup .to-skip{ margin-top:6px; font-size:10.5px; font-weight:600; color:rgba(255,255,255,.6); cursor:pointer; }
  #timeoutPopup .to-skip:hover{ color:#fff; }
  #timeoutHistoryPanel{
    position:absolute; right:12px; bottom:60px; z-index:9; width:270px; max-height:260px;
    background:rgba(10,13,20,.95); border:1px solid rgba(255,159,67,.4); border-radius:10px;
    display:none; flex-direction:column; box-shadow:0 8px 26px rgba(0,0,0,.45);
  }
  #timeoutHistoryPanel.show{ display:flex; }
  #timeoutHistoryPanel .th-head{ display:flex; align-items:center; justify-content:space-between; padding:9px 12px; font-size:11.5px; font-weight:700; color:#ff9f43; border-bottom:1px solid rgba(255,255,255,.08); }
  #timeoutHistoryPanel .th-close{ cursor:pointer; color:rgba(255,255,255,.5); }
  #timeoutHistoryPanel .th-close:hover{ color:#fff; }
  #timeoutHistoryPanel .th-list{ overflow-y:auto; padding:6px 10px; display:flex; flex-direction:column; gap:5px; }
  .th-item{ font-size:11px; padding:6px 8px; border-radius:6px; background:rgba(255,255,255,.03); }
  .th-item .th-round{ font-weight:700; color:rgba(255,255,255,.55); margin-right:6px; }
  .th-empty{ font-size:11px; color:rgba(255,255,255,.4); padding:10px 4px; text-align:center; }
  /* ===== Time-Out : consigne + arbre tactique ===== */
  #timeoutCoachPanel{
    position:absolute; left:50%; bottom:76px; transform:translateX(-50%); z-index:9;
    width:700px; max-width:92vw; max-height:340px;
    background:rgba(10,13,20,.96); border:1px solid rgba(255,159,67,.4); border-radius:12px;
    display:none; flex-direction:column; box-shadow:0 10px 30px rgba(0,0,0,.5); overflow:hidden;
  }
  #timeoutCoachPanel.show{ display:flex; }
  #timeoutCoachPanel .tc-head{ padding:9px 14px; font-size:12px; font-weight:800; color:#ff9f43; border-bottom:1px solid rgba(255,255,255,.08); }
  #timeoutCoachPanel .tc-input-row{ display:flex; gap:8px; padding:10px 14px 6px; }
  #timeoutKeywordInput{ flex:1; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); border-radius:6px; padding:7px 10px; color:#e8ecf2; font-size:12.5px; }
  #timeoutKeywordInput:focus{ outline:none; border-color:#ff9f43; }
  #timeoutGenerateBtn{ padding:7px 14px; font-size:12px; }
  #timeoutCoachPanel .tc-warning{ padding:0 14px 6px; font-size:11px; color:#ffb454; display:none; }
  #timeoutCoachPanel .tc-body{ display:flex; overflow:hidden; flex:1; border-top:1px solid rgba(255,255,255,.06); }
  #timeoutTreeView{ flex:0 0 44%; overflow-y:auto; padding:8px 10px; border-right:1px solid rgba(255,255,255,.08); font-size:11.5px; }
  #timeoutNodeDetail{ flex:1; overflow-y:auto; padding:10px 14px; font-size:11.5px; }
  .tt-row{ padding:2px 0; white-space:nowrap; }
  .tt-node{ cursor:pointer; padding:3px 6px; border-radius:5px; }
  .tt-node:hover{ background:rgba(255,255,255,.06); }
  .tt-node.selected{ background:rgba(255,159,67,.18); color:#ff9f43; font-weight:700; }
  .tt-branch{ font-size:9px; font-weight:700; margin-right:5px; padding:1px 5px; border-radius:4px; }
  .tt-branch.tt-win{ background:rgba(78,205,106,.18); color:#4ecd6a; }
  .tt-branch.tt-loss{ background:rgba(255,95,95,.18); color:#ff5f5f; }
  .td-title{ font-size:13px; font-weight:800; margin-bottom:8px; color:#e8ecf2; }
  .td-row{ margin-bottom:7px; }
  .td-row b{ display:block; font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:rgba(255,255,255,.5); margin-bottom:2px; }
  .td-empty{ color:rgba(255,255,255,.4); font-size:11.5px; }
  #timeoutAssistantBtn{ font-size:11px; padding:7px 10px; }
  #timeoutAssistantBtn.active{ background:#ff9f43; border-color:#ff9f43; }
  #timeoutKeywordInput:disabled{ opacity:.5; }
  .tc-assistant-box{
    display:none; margin:0 14px 8px; padding:8px 10px; border-radius:8px;
    background:rgba(255,159,67,.08); border:1px solid rgba(255,159,67,.3);
    font-size:11px; max-height:96px; overflow-y:auto;
  }
  .tc-assistant-box .ab-row{ display:flex; gap:6px; margin-bottom:3px; align-items:baseline; }
  .tc-assistant-box .ab-row b{ flex-shrink:0; width:88px; font-size:9.5px; text-transform:uppercase; letter-spacing:.03em; color:rgba(255,255,255,.5); }
  .tc-assistant-box #abConfidence{ color:#ff9f43; font-weight:800; }
  .tc-assistant-box ul{ margin:0; padding-left:16px; }
</style>
</head>
<body>
<div id="canvasWrap"></div>

<div id="topInfoBar">
  <div id="vetoInfo"></div>
  <div id="contextInfo"></div>
</div>
<div id="scoreboard">
  <div class="sb-group">
    <div class="sb-teamhead" id="sbBannerA">
      <div class="sb-badge" id="sbBadgeA"></div>
      <div class="sb-tag" id="sbNameA">EA</div>
      <div class="sb-bigscore" id="sbScoreA">0</div>
    </div>
    <div class="sb-pips" id="sbPipsA"></div>
    <span class="sb-banner-eco" id="sbEcoA">800 NX</span>
    <span class="sb-timeout-count" id="sbTimeoutA"></span>
    <div class="sb-side" id="sbAtk"></div>
  </div>
  <div id="scoreCenter">
    <div class="map" id="mapLabel">Outpost</div>
    <div class="roundlabel" id="roundLabel">ROUND 1</div>
    <div class="roundTimer" id="roundTimer">0:00</div>
    <div class="phase" id="phaseLabel">En attente</div>
  </div>
  <div class="sb-group right">
    <div class="sb-teamhead right" id="sbBannerB">
      <div class="sb-bigscore" id="sbScoreB">0</div>
      <div class="sb-tag" id="sbNameB">EB</div>
      <div class="sb-badge" id="sbBadgeB"></div>
    </div>
    <div class="sb-pips right" id="sbPipsB"></div>
    <span class="sb-banner-eco" id="sbEcoB">800 NX</span>
    <span class="sb-timeout-count" id="sbTimeoutB"></span>
    <div class="sb-side right" id="sbDef"></div>
  </div>
</div>

<canvas id="minimap" width="190" height="190"></canvas>
<div id="killfeed"></div>
<div id="centerBanner"><div class="main"></div><div class="sub"></div></div>
<div id="spectateBanner">👁 Vue subjective — <span class="spec-name"></span><span class="spec-exit" id="spectateExitBtn">Échap pour quitter ✕</span></div>
<div id="directorBanner">🎬 Mode réalisateur — <span class="dir-name"></span><span class="dir-exit" id="directorExitBtn">Échap pour quitter ✕</span></div>

<div id="timeoutPopup">
  <div class="to-eyebrow">⏸ Time-Out demandé</div>
  <div class="to-team"><div class="to-badge" id="toBadge"></div><div class="to-name" id="toName"></div></div>
  <div class="to-meta" id="toMeta"></div>
  <div class="to-clock" id="toClock">0:30</div>
  <div class="to-skip" id="timeoutSkipBtn">Passer ✕</div>
</div>
<div id="timeoutHistoryPanel">
  <div class="th-head">Historique des Time-Outs<span class="th-close" id="timeoutHistoryCloseBtn">✕</span></div>
  <div class="th-list" id="timeoutHistoryList"></div>
</div>
<div id="timeoutCoachPanel">
  <div class="tc-head" id="timeoutCoachHead"></div>
  <div class="tc-input-row" id="timeoutInputRow">
    <input type="text" id="timeoutKeywordInput" placeholder="Ex. Fast B, Split A, Eco...">
    <button class="btn" id="timeoutGenerateBtn">Générer le plan</button>
    <button class="btn" id="timeoutAssistantBtn" title="Laisse l'IA recommander automatiquement une consigne">🤖 Assistant Coach</button>
  </div>
  <div class="tc-warning" id="timeoutKeywordWarning"></div>
  <div class="tc-assistant-box" id="timeoutAssistantBox">
    <div class="ab-row"><b>Recommandation</b><span id="abRecText"></span></div>
    <div class="ab-row"><b>Confiance</b><span id="abConfidence"></span></div>
    <div class="ab-row"><b>Risque</b><span id="abRisk"></span></div>
    <div class="ab-row"><b>Raison</b><ul id="abReasons"></ul></div>
  </div>
  <div class="tc-body">
    <div class="tc-tree" id="timeoutTreeView"></div>
    <div class="tc-detail" id="timeoutNodeDetail"></div>
  </div>
</div>
